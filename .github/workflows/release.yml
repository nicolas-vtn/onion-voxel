name: Build and Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v4

    - name: Configure CMake
      run: >
        cmake -S . -B build
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DDEPLOY_BUILD=ON

    - name: Build
      run: cmake --build build

    - name: Install
      run: cmake --install build --prefix install

    - name: Prepare package
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path package/OnionVoxel
        Copy-Item -Recurse -Force install/client package/OnionVoxel/
        Copy-Item -Recurse -Force install/server package/OnionVoxel/

    - name: Create ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path package/OnionVoxel -DestinationPath OnionVoxel-${{ github.ref_name }}-win64.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-windows
        path: OnionVoxel-${{ github.ref_name }}-win64.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libcurl4-openssl-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl-dev

    - name: Configure CMake
      run: >
        cmake -S . -B build
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DDEPLOY_BUILD=ON

    - name: Build
      run: cmake --build build

    - name: Install
      run: cmake --install build --prefix install

    - name: Prepare package
      run: |
        rm -rf package
        mkdir -p package/OnionVoxel
        cp -r install/client package/OnionVoxel/
        cp -r install/server package/OnionVoxel/

    - name: Create tar.gz
      run: |
        tar -czf OnionVoxel-${{ github.ref_name }}-linux-x64.tar.gz -C package OnionVoxel

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-linux
        path: OnionVoxel-${{ github.ref_name }}-linux-x64.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]

    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: release-windows

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: release-linux

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OnionVoxel-${{ github.ref_name }}-win64.zip
          OnionVoxel-${{ github.ref_name }}-linux-x64.tar.gz
